<!DOCTYPE html>
<!-- Rain effect for front of page -->
<style>
.rain-drop {
    position: fixed;
    top: -40px;
    width: 2px;
    height: 18px;
    background: linear-gradient(to bottom, hsla(224, 100%, 85%, 0.7) 0%, rgba(180,200,255,0.2) 100%);
    border-radius: 1px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
    animation: rain-fall linear forwards;
}
@keyframes rain-fall {
    to {
        top: 110vh;
        opacity: 0.2;
    }
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    function spawnRainDrop() {
        const drop = document.createElement("div");
        drop.className = "rain-drop";
        drop.style.left = Math.random() * window.innerWidth + "px";
        drop.style.animationDuration = (0.7 + Math.random() * 0.7) + "s";
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 1200);
    }
    function rainLoop() {
        for (let i = 0; i < 4; i++) spawnRainDrop();
        setTimeout(rainLoop, 120);
    }
    rainLoop();
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const leafImages = ["./f1.png", "./f2.png"];
    const leaves = [];
    const minSize = 72, maxSize = 120;
    const minInterval = 1200, maxInterval = 2200;
    let spawnLeaves = true;

    function randomBetween(a, b) {
        return Math.random() * (b - a) + a;
    }

    function createLeaf() {
        const img = document.createElement("img");
        img.src = leafImages[Math.floor(Math.random() * leafImages.length)];
        img.style.position = "fixed";
        img.style.left = randomBetween(0, window.innerWidth - maxSize) + "px";
        img.style.top = randomBetween(-120, -60) + "px";
        const size = randomBetween(minSize, maxSize);
        img.style.width = size + "px";
        img.style.pointerEvents = "none";
        img.style.zIndex = "-1";
        img.style.opacity = randomBetween(0.2, 0.5);
        img.style.transform = `rotate(${randomBetween(-30,30)}deg)`;
        document.body.appendChild(img);
        leaves.push({
            el: img,
            x: parseFloat(img.style.left),
            y: parseFloat(img.style.top),
            speedY: randomBetween(1.2, 2.8),
            speedX: randomBetween(-0.7, 0.7),
            rot: randomBetween(-0.2, 0.2),
            angle: randomBetween(0, 360),
            size: size
        });
    }

    function animateLeaves() {
        for (const leaf of leaves) {
            leaf.y += leaf.speedY;
            leaf.x += leaf.speedX;
            leaf.angle += leaf.rot;
            leaf.el.style.top = leaf.y + "px";
            leaf.el.style.left = leaf.x + "px";
            leaf.el.style.transform = `rotate(${leaf.angle}deg)`;
            if (leaf.y > window.innerHeight) {
                leaf.el.remove();
                leaves.splice(leaves.indexOf(leaf), 1);
            }
        }
        requestAnimationFrame(animateLeaves);
    }

    function scheduleLeaf() {
        if (spawnLeaves) {
            createLeaf();
        }
        setTimeout(scheduleLeaf, randomBetween(minInterval, maxInterval));
    }

    document.addEventListener("visibilitychange", function() {
        spawnLeaves = !document.hidden;
    });

    scheduleLeaf();
    animateLeaves();
});
</script>
