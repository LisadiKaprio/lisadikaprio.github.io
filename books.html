const comicsShelf = document.getElementById("shelf-comics");
const mangaShelf = document.getElementById("shelf-manga");
const nonFictionShelf = document.getElementById("shelf-non-fiction");
const fictionShelf = document.getElementById("shelf-fiction");
const tooltip = document.getElementById("tooltip")

// container.style.display = "flex"
// container.style.flexDirection = "column"
// container.style.gap = "0"

tooltip.style.display = "none"

function addBook(book, targetShelfElement)  {
  const img = document.createElement("img")
  img.src = "books-pngs/" + book.img
  img.classList.add("book")

  const text = book.author + ": " + book.title

  img.addEventListener("mousemove", e => {
    tooltip.style.display = "block"
    tooltip.textContent = text
    tooltip.style.left = e.clientX + "px"
    tooltip.style.top = e.clientY + 20 + "px"
  })

  img.addEventListener("mouseleave", () => {
    tooltip.style.display = "none"
  })

  img.addEventListener("click", () => {
    navigator.clipboard.writeText(text)
    tooltip.textContent = "Copied to clipboard!"
    tooltip.style.display = "block"
    setTimeout(() => tooltip.textContent = text, 850)
  })

  targetShelfElement.appendChild(img)
}

comics.slice().forEach(book => {
    addBook(book, comicsShelf)
})

mangas.slice().forEach(book => {
    addBook(book, mangaShelf)
})

books_nonfiction.slice().forEach(book => {
    addBook(book, nonFictionShelf)
})

books_fiction.slice().forEach(book => {
    addBook(book, fictionShelf)
})
